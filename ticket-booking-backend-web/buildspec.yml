version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm install
  
  pre_build:
    commands:
      - echo "Pre-build phase..."
      # You can add linting or tests here
      # - npm run lint
      # - npm test
      
  build:
    commands:
      - echo "Build started on `date`"
      - echo "Building the Node.js application..."
      
  post_build:
    commands:
      - echo "Build completed on `date`"
      - echo "Preparing artifacts for deployment..."

artifacts:
  files:
    - '**/*'
  exclude-paths:
    - '.git/**/*'
    - 'prompt_*.md'
    - '.env' # Do not include local env file in artifacts
