version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm ci --production
  build:
    commands:
      - echo "Build completed on `date`"
artifacts:
  files:
    - '**/*'
  exclude-paths:
    - '.git/**/*'
    - '.env'
